<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 | KFTA 한국패션테라피협회</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { kftaGreen: '#3B4B38', kftaRed: '#8B1A1A', kftaBeige: '#E8E3D9', kftaLight: '#F9F8F6', kftaBorder: '#D1C9BB' }, fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['Pretendard', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script src="assets/js/auth.js"></script>
    <style>
        @font-face {
            font-family: 'AmpersandSerif';
            src: local('Baskerville'), local('Georgia'), local('Times New Roman'), serif;
            unicode-range: U+0026;
        }
        body, h1, h2, h3, h4, h5, h6, p, a, span, div {
            font-family: 'AmpersandSerif', 'Pretendard', sans-serif !important;
        }
        /* 한글 단어가 줄 끝에서 잘리지 않게 */
        body, h1, h2, h3, h4, h5, h6, p, li, span, a, td, th, button {
            word-break: keep-all;
            overflow-wrap: break-word;
        }
    </style>
</head>
<body class="bg-kftaLight min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full">
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">

            <!-- 헤더 -->
            <div class="bg-kftaGreen py-9 px-8 text-center">
                <a href="index.html" class="inline-block"><img src="assets/kfta-logo-real.png" alt="KFTA" class="h-9 w-auto brightness-0 invert opacity-95"></a>
            </div>

            <div class="p-8">
                <div class="mb-6 rounded-xl bg-amber-50 border border-amber-200 px-4 py-3.5 text-left">
                    <p class="text-[13px] font-bold text-amber-900 mb-1">정식 오픈 전 임시 가입입니다</p>
                    <p class="text-xs text-amber-800 leading-relaxed break-keep">입력하신 정보는 이 기기에만 저장되며 협회 서버로 전송되지 않습니다. 결제 · 수강 시스템 연동 후 정식 계정으로 전환해 드립니다.</p>
                </div>
                <h1 class="text-center text-xl font-bold text-gray-900 mb-2">3초 만에 시작하세요</h1>
                <p class="text-center text-[15px] text-gray-500 leading-relaxed break-keep mb-7">클래스 신청과 수강 내역을 한 곳에서 관리하실 수 있습니다.</p>

                <!-- 카카오 시작하기 -->
                <button type="button" id="kakaoBtn"
                        class="w-full bg-[#FEE500] hover:brightness-95 text-[#191600] font-bold py-4 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2.5 text-base">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M12 3C6.99 3 3 6.2 3 10.14c0 2.52 1.66 4.73 4.16 5.99l-.9 3.3c-.09.32.27.58.55.4l3.96-2.6c.4.04.81.06 1.23.06 5.01 0 9-3.2 9-7.15C21 6.2 17.01 3 12 3z"/>
                    </svg>
                    카카오로 시작하기
                </button>
                <p id="kakaoNote" class="text-center text-xs text-gray-400 mt-2.5">카카오 로그인은 연동 준비 중입니다</p>

                <!-- 구분선 -->
                <div class="flex items-center gap-4 my-7">
                    <span class="flex-1 h-px bg-gray-200"></span>
                    <span class="text-xs text-gray-400 whitespace-nowrap">또는 이메일로 가입</span>
                    <span class="flex-1 h-px bg-gray-200"></span>
                </div>

                <!-- 이메일 가입 -->
                <form id="signupForm" class="space-y-4">
                    <div>
                        <label for="su-name" class="block text-sm font-bold text-gray-700 mb-1.5">이름</label>
                        <input type="text" id="su-name" required placeholder="홍길동"
                               class="w-full px-4 py-3 rounded-xl bg-kftaLight border border-kftaBorder focus:outline-none focus:ring-2 focus:ring-kftaGreen focus:border-transparent transition">
                    </div>
                    <div>
                        <label for="su-email" class="block text-sm font-bold text-gray-700 mb-1.5">이메일</label>
                        <input type="email" id="su-email" required placeholder="example@naver.com"
                               class="w-full px-4 py-3 rounded-xl bg-kftaLight border border-kftaBorder focus:outline-none focus:ring-2 focus:ring-kftaGreen focus:border-transparent transition">
                    </div>
                    <div>
                        <label for="su-phone" class="block text-sm font-bold text-gray-700 mb-1.5">휴대폰 번호</label>
                        <input type="tel" id="su-phone" required placeholder="010-0000-0000" inputmode="numeric"
                               class="w-full px-4 py-3 rounded-xl bg-kftaLight border border-kftaBorder focus:outline-none focus:ring-2 focus:ring-kftaGreen focus:border-transparent transition">
                        <p class="text-xs text-gray-400 mt-1.5">개강 안내와 일정 변경을 문자로 보내드립니다.</p>
                    </div>

                    <!-- 약관 -->
                    <div class="pt-2">
                        <label class="flex items-start gap-3 p-3.5 rounded-xl bg-kftaBeige/50 border border-kftaBorder cursor-pointer">
                            <input type="checkbox" id="agreeAll" class="mt-0.5 w-5 h-5 accent-kftaGreen flex-none">
                            <span class="text-sm font-bold text-gray-800">전체 동의</span>
                        </label>
                        <div class="mt-2.5 space-y-2 pl-1">
                            <label class="flex items-start gap-2.5 text-xs text-gray-600 cursor-pointer">
                                <input type="checkbox" class="agree-req mt-0.5 w-4 h-4 accent-kftaGreen flex-none" required>
                                <span>[필수] <a href="terms.html" class="underline hover:text-kftaRed">이용약관</a> 및 <a href="privacy.html" class="underline hover:text-kftaRed">개인정보처리방침</a>에 동의합니다</span>
                            </label>
                            <label class="flex items-start gap-2.5 text-xs text-gray-600 cursor-pointer">
                                <input type="checkbox" id="agreeMkt" class="agree-opt mt-0.5 w-4 h-4 accent-kftaGreen flex-none">
                                <span>[선택] 클래스 개강 소식 및 혜택 안내를 받겠습니다</span>
                            </label>
                        </div>
                    </div>

                    <button type="submit"
                            class="w-full bg-kftaRed hover:bg-red-900 text-white font-bold py-4 rounded-xl transition-colors shadow-md text-base mt-2">
                        가입하기
                    </button>
                </form>

                <p class="text-center text-sm text-gray-500 mt-6">
                    이미 계정이 있으신가요?
                    <a href="login.html" class="text-kftaGreen font-bold underline hover:no-underline">로그인</a>
                </p>
            </div>
        </div>

        <p class="text-center text-xs text-gray-400 mt-5 leading-relaxed">
            현재는 정식 오픈 전 임시 가입입니다.<br>
            결제·수강 시스템 연동 후 정식 계정으로 전환해 드립니다.
        </p>
        <p class="text-center text-xs text-gray-400 mt-3">
            <a href="index.html" class="underline hover:text-kftaGreen">홈으로 돌아가기</a>
        </p>
    </div>

    <script>
        // 전체 동의 ↔ 개별 동의 연동
        const agreeAll = document.getElementById('agreeAll');
        const boxes = Array.from(document.querySelectorAll('.agree-req, .agree-opt'));
        agreeAll.addEventListener('change', () => boxes.forEach(b => b.checked = agreeAll.checked));
        boxes.forEach(b => b.addEventListener('change', () => {
            agreeAll.checked = boxes.every(x => x.checked);
        }));

        // 휴대폰 자동 하이픈
        const phone = document.getElementById('su-phone');
        phone.addEventListener('input', () => {
            const v = phone.value.replace(/\D/g, '').slice(0, 11);
            phone.value = v.length < 4 ? v
                        : v.length < 8 ? v.slice(0,3) + '-' + v.slice(3)
                        : v.slice(0,3) + '-' + v.slice(3,7) + '-' + v.slice(7);
        });

        // 카카오 — 연동 전 안내
        document.getElementById('kakaoBtn').addEventListener('click', () => {
            alert('카카오 로그인은 연동 준비 중입니다.\n아래 이메일 가입을 이용해 주세요.');
        });

        // 가입 처리 (연동 전 임시 저장)
        document.getElementById('signupForm').addEventListener('submit', function (e) {
            e.preventDefault();
            if (!document.querySelector('.agree-req').checked) {
                alert('필수 약관에 동의해 주세요.');
                return;
            }
            const name  = document.getElementById('su-name').value.trim();
            const email = document.getElementById('su-email').value.trim();
            const tel   = document.getElementById('su-phone').value.trim();
            if (!name || !email || !tel) return;

            Auth.signup({ name, email, phone: tel, marketing: document.getElementById('agreeMkt').checked });

            const redirect = new URLSearchParams(window.location.search).get('redirect');
            window.location.href = redirect ? redirect : 'mypage.html';
        });
    </script>
</body>
</html>
