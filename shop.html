<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | KFTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { kftaGreen: '#3B4B38', kftaRed: '#8B1A1A', kftaBeige: '#E8E3D9', kftaLight: '#F9F8F6', kftaBorder: '#D1C9BB' }, fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['Pretendard', 'sans-serif'] } } } }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body class="font-sans text-gray-800 bg-kftaLight antialiased">
    <header class="sticky top-0 bg-kftaBeige/90 backdrop-blur-md z-50 border-b border-kftaBorder animate__animated animate__fadeInDown">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
                <img src="assets/kfta-logo.jpg" alt="KFTA Logo" class="h-10 w-auto mix-blend-multiply">
                <span class="font-serif text-2xl text-kftaGreen font-bold tracking-widest">FASHION THERAPY</span>
            </a>
            <nav class="hidden md:flex gap-8">
                <a href="index.html" class="text-sm font-bold text-kftaGreen uppercase">ABOUT</a>
                <a href="academy.html" class="text-sm font-bold text-kftaGreen uppercase">ACADEMY</a>
                <a href="certification.html" class="text-sm font-bold text-kftaGreen uppercase">CERTIFICATION</a>
                <a href="consulting.html" class="text-sm font-bold text-kftaGreen uppercase">CONSULTING</a>
                <a href="corporate.html" class="text-sm font-bold text-kftaGreen uppercase">CORPORATE</a>
                <a href="shop.html" class="text-sm font-bold text-kftaRed uppercase">SHOP</a>
                <a href="community.html" class="text-sm font-bold text-kftaGreen uppercase">COMMUNITY</a>
            </nav>
        </div>
    </header>

    <section class="bg-kftaGreen text-white py-24 px-6">
        <div class="max-w-7xl mx-auto text-center">
            <h1 class="font-serif text-5xl md:text-6xl mb-8">Shop</h1>
            <p class="text-xl max-w-2xl mx-auto opacity-90">옷장 밖에서도, 패션테라피와 함께 도서·컬러링북·프로 키트·클래스 예약까지 만나보세요.</p>
        </div>
    </section>

    <section class="bg-kftaLight py-24 px-6">
        <div class="max-w-7xl mx-auto">
            <h2 class="font-serif text-4xl text-kftaGreen mb-12 border-b-2 border-kftaGreen pb-4 inline-block">Books</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-8 mb-24">
                <div class="bg-white rounded-2xl p-6 shadow-md hover:shadow-xl transition-shadow text-center">
                    <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Book 1" class="w-full h-48 object-cover rounded-xl mb-4">
                    <h4 class="font-bold text-lg text-kftaGreen mb-2">반짝반짝 패션 놀이</h4>
                    <p class="text-sm text-gray-500">어린이용 컬러링북</p>
                </div>
                <div class="bg-white rounded-2xl p-6 shadow-md hover:shadow-xl transition-shadow text-center">
                    <img src="https://images.unsplash.com/photo-1589829085413-56de8ae18c73?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Book 2" class="w-full h-48 object-cover rounded-xl mb-4">
                    <h4 class="font-bold text-lg text-kftaGreen mb-2">시니어 패션 컬러링북</h4>
                    <p class="text-sm text-gray-500">나의 가장 빛나는 시절</p>
                </div>
                <div class="bg-white rounded-2xl p-6 shadow-md hover:shadow-xl transition-shadow text-center">
                    <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Book 3" class="w-full h-48 object-cover rounded-xl mb-4">
                    <h4 class="font-bold text-lg text-kftaGreen mb-2">다시, 나를 입는 시간</h4>
                    <p class="text-sm text-gray-500">패션 테라피 안내서</p>
                </div>
                <div class="bg-white rounded-2xl p-6 shadow-md hover:shadow-xl transition-shadow text-center">
                    <img src="https://images.unsplash.com/photo-1497633762265-9d179a990aa6?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Book 4" class="w-full h-48 object-cover rounded-xl mb-4">
                    <h4 class="font-bold text-lg text-kftaGreen mb-2">패션테라피 교재</h4>
                    <p class="text-sm text-gray-500">자격 과정 전용 교재</p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
