<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제하기 | KFTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { kftaGreen: '#3B4B38', kftaRed: '#8B1A1A', kftaBeige: '#E8E3D9', kftaLight: '#F9F8F6', kftaBorder: '#D1C9BB' }, fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['Pretendard', 'sans-serif'] } } } }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script>
        /* =====================================================================
           전 상품 가격표 — 새 상품을 추가하면 여기에 한 줄만 넣으십시오.
           key   : checkout.html?item=... 으로 넘어오는 상품명(부분 일치)
           price : 표시 금액(원)
           cert  : true 이면 '수료증 발급비 100,000원 별도' 안내를 함께 표시
           ===================================================================== */
        const PRICES = [
          // ── SHOP · 교재 (과정명과 겹치므로 반드시 먼저 검사) ──
          { key:'워크북',                 price:25000 },
          { key:'패션테라피의 모든 것',      price:25000 },
          // ── 자격 과정 ──
          { key:'Master Trainer',        price:3000000, cert:true },
          { key:'마스터트레이너',          price:3000000, cert:true },
          { key:'Trainer',               price:2700000, cert:true },
          { key:'Level 3',               price:2500000, cert:true },
          { key:'레벨3',                  price:2500000, cert:true },
          { key:'Level 2',               price:2300000, cert:true },
          { key:'레벨2',                  price:2300000, cert:true },
          { key:'Level 1',               price:2000000, cert:true },
          { key:'레벨1',                  price:2000000, cert:true },
          // ── 컨설팅 ──
          { key:'퍼스널 이미지 브랜딩',     price:500000 },
          { key:'옷장 다이어트',           price:400000 },
          { key:'엄마프사 프로젝트',        price:400000 },
          { key:'마인드 컬러 컨설팅',       price:250000 },
          // ── One Day Class ──
          { key:'4050 뷰티큐레이션',       price:200000 },
          { key:'인형으로 만나는 어린 나',   price:180000 },
          { key:'나의 컬러 팔레트 맵',      price:150000 },
          { key:'인생 파노라마',           price:150000 },
          { key:'내 향을 담은 화장품 DIY',  price:150000 },
          { key:'패션 마인드 디톡스',       price:120000 },
          { key:'향으로 읽는 내 감정',      price:100000 },
          { key:'나만의 시그니처 향수',      price:100000 },
          // ── Kids & Family ──
          { key:'서로를 비추는 거울',       price:120000 },
          { key:'꼬마 디자이너의 안목',      price:80000 },
          { key:'오감 테라피',             price:60000 },
          { key:'마음을 칠하는 시간',       price:50000 },
          // ── SHOP · 교구 ──
          { key:'진단천 41컬러',           price:350000 },
          { key:'페이스 퍼스널컬러 진단판',  price:200000 },
          { key:'립페이스',               price:60000 },
          { key:'소재 팔레트',             price:50000 },
          { key:'체험키트 No.2',           price:45000 },
          { key:'네크라인 진단천',          price:40000 },
          { key:'체험키트 No.1',           price:35000 },
          { key:'바디 실루엣 카드',         price:30000 },
          { key:'패션이미지 카드',          price:30000 },
          { key:'패션 부정어 카드',         price:30000 },
          { key:'패션 감정 다이어리',       price:18000 },
          { key:'컬러 카드 18종',          price:10000 },
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const itemName = params.get("item") || "";
            const hit = itemName ? PRICES.find(p => itemName.includes(p.key)) : null;

            document.getElementById("item-name").textContent = itemName || "상품이 선택되지 않았습니다";

            const priceEl = document.getElementById("item-price");
            const noteEl  = document.getElementById("price-note");
            const payBtn  = document.getElementById("pay-btn");

            if (hit) {
                priceEl.textContent = hit.price.toLocaleString("ko-KR") + " 원";
                noteEl.textContent  = hit.cert ? "총 결제 금액 (수료증 발급비 100,000원 별도)" : "총 결제 금액";
            } else {
                // 가격표에 없는 상품은 임의 금액을 노출하지 않는다
                priceEl.textContent = "문의";
                priceEl.classList.remove("text-2xl");
                priceEl.classList.add("text-xl");
                noteEl.textContent  = "금액 안내";
                if (payBtn) {
                    payBtn.textContent = "카카오채널로 문의하기";
                    payBtn.setAttribute("onclick", "window.open('https://pf.kakao.com/_vxitxaX','_blank')");
                }
            }
        });

        function processPayment() {
            alert("결제 시스템 연동 전입니다.\n(실제 카드 결제 및 PG 연동은 추후 적용됩니다.)");

        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'AmpersandSerif';
            src: local('Baskerville'), local('Georgia'), local('Times New Roman'), serif;
            unicode-range: U+0026;
        }
        body, h1, h2, h3, h4, h5, h6, p, a, span, div {
            font-family: 'AmpersandSerif', 'Pretendard', sans-serif !important;
        }
    </style>
</head>
<body class="font-sans text-gray-800 bg-kftaLight antialiased flex flex-col min-h-screen">
    
    <header class="bg-white border-b border-kftaBorder py-4 px-6 text-center shadow-sm">
        <a href="index.html">
            <img src="assets/kfta-logo-real.png" alt="KFTA Logo" class="h-12 w-auto mx-auto inline-block">
        </a>
    </header>

    <main class="flex-grow flex items-center justify-center p-6 animate__animated animate__fadeIn">
        <div class="bg-white max-w-lg w-full rounded-3xl shadow-xl overflow-hidden border border-gray-100">
            <div class="bg-kftaGreen p-8 text-center text-white">
                <h2 class="text-2xl font-bold mb-2">신청 및 결제</h2>
                <p class="text-kftaLight/80 text-sm">신청 정보를 입력하고 결제를 진행해 주세요.</p>
            </div>
            
            <div class="p-8">
                <div class="mb-8 p-6 bg-gray-50 rounded-2xl border border-gray-100">
                    <p class="text-sm text-gray-500 mb-1">선택한 상품</p>
                    <h3 id="item-name" class="font-bold text-xl text-kftaGreen mb-4">로딩중...</h3>
                    <div class="flex justify-between items-center border-t border-gray-200 pt-4 mt-4">
                        <span id="price-note" class="text-gray-600">총 결제 금액</span>
                        <span id="item-price" class="font-bold text-2xl text-kftaRed">0 원</span>
                    </div>
                </div>

                <form onsubmit="event.preventDefault(); processPayment();">
                    <div class="space-y-4 mb-8">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">신청자 성함</label>
                            <input type="text" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-kftaGreen focus:border-transparent transition-shadow" placeholder="홍길동">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">휴대폰 번호</label>
                            <input type="tel" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-kftaGreen focus:border-transparent transition-shadow" placeholder="010-0000-0000">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">이메일</label>
                            <input type="email" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-kftaGreen focus:border-transparent transition-shadow" placeholder="example@email.com">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">결제 수단</label>
                            <select class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-kftaGreen transition-shadow bg-white">
                                <option>신용/체크카드</option>
                                <option>무통장 입금</option>
                                <option>네이버페이 / 카카오페이</option>
                            </select>
                        </div>
                    </div>
                    
                    <button type="submit" id="pay-btn" class="w-full bg-kftaRed hover:bg-red-900 text-white font-bold py-4 rounded-xl transition-colors text-lg shadow-lg shadow-red-900/20">
                        안전하게 결제하기
                    </button>
                    <div class="mt-4 text-center">
                        <a href="javascript:history.back()" class="text-sm text-gray-500 hover:text-gray-800 underline">이전으로 돌아가기</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
