<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상세 보기 | KFTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { kftaGreen: '#3B4B38', kftaRed: '#8B1A1A', kftaBeige: '#E8E3D9', kftaLight: '#F9F8F6', kftaBorder: '#D1C9BB' }, fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['Pretendard', 'sans-serif'] } } } }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const item = params.get("item") || "프로그램";
            
            document.getElementById("detail-title").textContent = item;
            
            // Just dummy detailed info for mockup purposes
            let price = "500,000 원";
            let desc = "한국패션테라피협회의 전문 프로그램입니다. 분석 기준에 맞추어 개개인의 심리와 상황에 최적화된 패션 솔루션을 제공합니다.";
            
            if(item.includes("Level 1")) { price = "800,000 원"; desc = "자격과정 Level 1 Foundation 상세 안내 페이지입니다. 총 12시간 과정으로 진행됩니다."; }
            else if(item.includes("Level 2")) { price = "1,200,000 원"; desc = "자격과정 Level 2 Practitioner 상세 안내 페이지입니다. 총 20시간 과정으로 진행됩니다."; }
            else if(item.includes("Level 3")) { price = "1,500,000 원"; desc = "자격과정 Level 3 Master Practitioner 상세 안내 페이지입니다. 총 24시간 과정으로 진행됩니다."; }
            
            document.getElementById("detail-price").textContent = price;
            document.getElementById("detail-desc").textContent = desc;
            
            document.getElementById("apply-btn").href = "checkout.html?item=" + encodeURIComponent(item);
        });
    </script>
</head>
<body class="font-sans text-gray-800 bg-kftaLight antialiased flex flex-col min-h-screen">
    
    <header class="bg-white border-b border-kftaBorder py-4 px-6 text-center shadow-sm">
        <a href="index.html" class="font-serif text-2xl text-kftaGreen font-bold tracking-widest">FASHION THERAPY</a>
    </header>

    <main class="flex-grow flex items-center justify-center p-6 animate__animated animate__fadeIn">
        <div class="bg-white max-w-3xl w-full rounded-3xl shadow-xl overflow-hidden border border-gray-100 flex flex-col md:flex-row">
            <div class="w-full md:w-1/2 bg-gray-200">
                <img src="https://images.unsplash.com/photo-1542385151-efd9000785a0?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Detail Image" class="w-full h-full object-cover min-h-[300px]">
            </div>
            <div class="w-full md:w-1/2 p-10 flex flex-col justify-center">
                <span class="text-kftaRed text-sm font-bold mb-2 uppercase tracking-widest">Program Details</span>
                <h2 id="detail-title" class="text-3xl font-bold text-kftaGreen mb-6">로딩중...</h2>
                <p id="detail-desc" class="text-gray-600 mb-8 leading-relaxed">상세 설명을 불러오는 중입니다.</p>
                
                <div class="border-t border-gray-200 pt-6 mb-8 flex justify-between items-center">
                    <span class="text-gray-500 font-medium">참가 비용</span>
                    <span id="detail-price" class="text-2xl font-bold text-kftaGreen">0 원</span>
                </div>
                
                <a id="apply-btn" href="#" class="w-full block text-center bg-kftaRed hover:bg-red-900 text-white font-bold py-4 rounded-xl transition-colors text-lg shadow-lg">
                    신청하기
                </a>
                <div class="mt-4 text-center">
                    <a href="javascript:history.back()" class="text-sm text-gray-500 hover:text-gray-800 underline">뒤로 가기</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
