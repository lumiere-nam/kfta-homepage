<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | KFTA 한국패션테라피협회</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { kftaGreen: '#3B4B38', kftaRed: '#8B1A1A', kftaBeige: '#E8E3D9', kftaLight: '#F9F8F6', kftaBorder: '#D1C9BB' }, fontFamily: { serif: ['Pretendard', '-apple-system', 'sans-serif'], sans: ['Pretendard', '-apple-system', 'sans-serif'] } } } }
    </script>
    <script src="assets/js/auth.js"></script>
    <style>
        /* 사이트 전체 단일 프리미엄 폰트(Pretendard)로 100% 일원화 */
        body, h1, h2, h3, h4, h5, h6, p, li, a, span, div, button, input, textarea,
        .font-serif, [class*="font-serif"],
        .font-sans, [class*="font-sans"] {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        }
        /* 한글 단어가 줄 끝에서 잘리지 않게 */
        body, h1, h2, h3, h4, h5, h6, p, li, span, a, td, th, button {
            word-break: keep-all;
            overflow-wrap: break-word;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

</head>
<body class="bg-kftaLight min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        <div class="bg-kftaGreen py-9 px-8 text-center">
            <a href="index.html" class="inline-block"><img src="assets/kfta-logo-real.png" alt="KFTA" class="h-9 w-auto brightness-0 invert opacity-95"></a>
        </div>
        <div class="p-8">
            <p class="text-center text-[15px] text-gray-500 leading-relaxed break-keep mb-6">클래스 신청과 수강 내역을 확인하실 수 있습니다.</p>

            <!-- 1. 이메일 & 비밀번호 로그인 (상단 배치) -->
            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-bold text-gray-700 mb-1.5">이메일</label>
                    <input type="email" id="email" required placeholder="example@naver.com" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-kftaGreen focus:ring-2 focus:ring-kftaGreen/20 outline-none transition-all">
                </div>
                <div>
                    <label for="password" class="block text-sm font-bold text-gray-700 mb-1.5">비밀번호</label>
                    <input type="password" id="password" required placeholder="비밀번호를 입력하세요" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-kftaGreen focus:ring-2 focus:ring-kftaGreen/20 outline-none transition-all">
                </div>
                <button type="submit" class="w-full bg-kftaRed hover:bg-red-900 text-white font-bold py-3.5 rounded-xl transition-colors shadow-md text-base mt-2">
                    로그인 및 시작하기
                </button>
            </form>

            <!-- 2. 회원가입 링크 (카카오 로그인 위쪽) -->
            <p class="text-center text-sm text-gray-500 mt-4 mb-6">
                계정이 없으신가요? <a href="signup.html" class="text-kftaGreen font-bold underline hover:no-underline ml-1">회원가입</a>
            </p>

            <!-- 3. 구분선 -->
            <div class="flex items-center gap-4 my-6">
                <span class="flex-1 h-px bg-gray-200"></span>
                <span class="text-xs text-gray-400 whitespace-nowrap">또는 SNS 계정으로 로그인</span>
                <span class="flex-1 h-px bg-gray-200"></span>
            </div>

            <!-- 4. 카카오 로그인 버튼 (하단 배치) -->
            <button type="button" id="kakaoBtn" class="w-full bg-[#FEE500] hover:brightness-95 text-[#191600] font-bold py-3.5 rounded-xl transition-all shadow-xs flex items-center justify-center gap-2.5 text-base">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3C6.99 3 3 6.2 3 10.14c0 2.52 1.66 4.73 4.16 5.99l-.9 3.3c-.09.32.27.58.55.4l3.96-2.6c.4.04.81.06 1.23.06 5.01 0 9-3.2 9-7.15C21 6.2 17.01 3 12 3z"/></svg>
                카카오 로그인
            </button>
            <p class="text-center text-xs text-gray-400 mt-2.5 mb-2">카카오 로그인은 연동 준비 중입니다</p>
        </div>
    </div>

    <script>
        document.getElementById('kakaoBtn').addEventListener('click', () => {
            alert('카카오 로그인은 연동 준비 중입니다.\n위의 이메일 로그인을 이용해 주세요.');
        });
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pw = document.getElementById('password').value;
            if(email && pw) {
                Auth.login(email, pw);
                // Redirect back to referring page if it has ?redirect=
                const urlParams = new URLSearchParams(window.location.search);
                const redirect = urlParams.get('redirect');
                window.location.href = redirect ? redirect : 'mypage.html';
            }
        });
    </script>
</body>
</html>
