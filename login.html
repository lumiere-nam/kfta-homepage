<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | KFTA 한국패션테라피협회</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { kftaGreen: '#3B4B38', kftaRed: '#8B1A1A', kftaBeige: '#E8E3D9', kftaLight: '#F9F8F6', kftaBorder: '#D1C9BB' }, fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['Pretendard', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="assets/js/auth.js"></script>
    <style>body { font-family: 'Pretendard', sans-serif; }</style>
</head>
<body class="bg-kftaLight min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        <div class="bg-kftaGreen p-8 text-center">
            <a href="index.html" class="flex justify-center mb-5"><img src="assets/kfta-logo-real.png" alt="KFTA Logo" class="h-12 w-auto brightness-0 invert"></a>
            <p class="text-kftaBeige text-sm mt-2">클래스 신청과 수강 내역을 확인하실 수 있습니다.</p>
        </div>
        <div class="p-8">
            <button type="button" id="kakaoBtn" class="w-full bg-[#FEE500] hover:brightness-95 text-[#191600] font-bold py-4 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2.5 text-base mb-2.5">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3C6.99 3 3 6.2 3 10.14c0 2.52 1.66 4.73 4.16 5.99l-.9 3.3c-.09.32.27.58.55.4l3.96-2.6c.4.04.81.06 1.23.06 5.01 0 9-3.2 9-7.15C21 6.2 17.01 3 12 3z"/></svg>
                    카카오로 로그인
                </button>
                <p class="text-center text-xs text-gray-400 mb-7">카카오 로그인은 연동 준비 중입니다</p>
                <div class="flex items-center gap-4 mb-6">
                    <span class="flex-1 h-px bg-gray-200"></span>
                    <span class="text-xs text-gray-400 whitespace-nowrap">또는 이메일로</span>
                    <span class="flex-1 h-px bg-gray-200"></span>
                </div>
                <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">이메일</label>
                    <input type="email" id="email" required placeholder="example@naver.com" class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-kftaGreen focus:ring-2 focus:ring-kftaGreen outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">비밀번호</label>
                    <input type="password" id="password" required placeholder="비밀번호를 입력하세요" class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-kftaGreen focus:ring-2 focus:ring-kftaGreen outline-none transition-all">
                </div>
                <button type="submit" class="w-full bg-kftaRed hover:bg-red-900 text-white font-bold py-3 rounded-lg transition-colors shadow-md text-lg">
                    로그인 및 시작하기
                </button>
                <p class="text-center text-sm text-gray-500">
                    계정이 없으신가요? <a href="signup.html" class="text-kftaGreen font-bold underline hover:no-underline">회원가입</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('kakaoBtn').addEventListener('click', () => {
            alert('카카오 로그인은 연동 준비 중입니다.
아래 이메일 로그인을 이용해 주세요.');
        });
        <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pw = document.getElementById('password').value;
            if(email && pw) {
                Auth.login(email, pw);
                // Redirect back to referring page if it has ?redirect=
                const urlParams = new URLSearchParams(window.location.search);
                const redirect = urlParams.get('redirect');
                window.location.href = redirect ? redirect : 'mypage.html';
            }
        });
    </script>
</body>
</html>
